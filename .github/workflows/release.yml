name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg_url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64
            ffmpeg_name: univ-ffmpeg-x86_64-pc-windows-msvc.exe
          - platform: macos-14
            target: aarch64-apple-darwin
            ffmpeg_url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
            ffmpeg_name: univ-ffmpeg-aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            ffmpeg_url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64
            ffmpeg_name: univ-ffmpeg-x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # .gitignore로 사이드카가 저장소에 없으므로 빌드 직전에 내려받아 배치한다.
      - name: Download FFmpeg sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fL --retry 3 "${{ matrix.ffmpeg_url }}" -o "src-tauri/binaries/${{ matrix.ffmpeg_name }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_name }}"
          ls -l src-tauri/binaries

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Univ-Agent ${{ github.ref_name }}"
          releaseBody: "설치 파일을 받아 실행하세요. (Windows: .exe/.msi, macOS: .dmg)"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
